name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Messages are extracted
        run: node scripts/extract-messages.mjs --check
      - name: Unit tests (core, notations, importers, connectors, plugin sandbox)
        run: pnpm test
      - name: Command-line tool builds and runs on plain Node
        run: |
          pnpm --filter @vastitecture/cli build
          node packages/cli/dist/vastitecture.mjs formats
      - name: Install Playwright's Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium
      - name: UI tests (web build)
        working-directory: apps/desktop
        env:
          CI: "1"
        run: pnpm exec playwright test --trace off
      - name: No file signatures in the bundle (the desktop webview sniffs content types)
        run: node scripts/check-bundle.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/desktop/test-results

  rust:
    name: Native shell
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - run: cargo test -p vastitecture-shell
      - run: cargo clippy -p vastitecture-shell -- -D warnings

  desktop:
    name: Desktop app (Linux, end to end)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries, WebKit WebDriver and a virtual display
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev webkit2gtk-driver xvfb
      - run: pnpm install --frozen-lockfile
      - name: Build the desktop app
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle
      - run: cargo install tauri-driver --locked
      - name: Create, edit and reopen a folder workspace in the real app
        run: |
          mkdir -p "$RUNNER_TEMP/ws"
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          xvfb-run -a bash -c 'tauri-driver & sleep 2; node scripts/desktop-smoke.mjs "$PWD/target/release/vastitecture" "$RUNNER_TEMP/ws"'

